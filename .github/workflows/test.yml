name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine tests
        run: node test/engine.test.js
      - name: UI tests (jsdom)
        run: |
          npm i --no-save --no-package-lock jsdom
          node test/ui.test.js
